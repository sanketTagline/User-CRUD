<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
        <!-- Heading  -->
    <header class="navbar">
        <h1>User Management System</h1>
    </header>



    <main class="container">
        
        <!-- User-Form  -->

        <section class="form-card">
            <h2 id="form-title">Add User</h2>
            
            <form id="userForm">

                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" placeholder="Enter name" required>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="Enter email" required>
                </div>

                <div class="form-group">
                    <label for="phoneNumber">Phone Number</label>
                    <input style="width:200px;" type="number" id="phoneNumber" placeholder="Enter phone number" max="10" required>
                </div>

                <div class="form-group">
                    <label>Gender</label>
                    <div class="radio-group">
                        <label><input type="radio" name="gender" value="Male"> Male</label>
                        <label><input type="radio" name="gender" value="Female"> Female</label>
                        <label><input type="radio" name="gender" value="Other"> Other</label>
                    </div>
                </div>

                <div class="form-group">
                    <label>Hobbies</label>
                    <div class="checkbox-group">
                        <label><input type="checkbox" name="hobbies" value="Cricket"> Cricket</label>
                        <label><input type="checkbox" name="hobbies" value="Reading"> Reading</label>
                        <label><input type="checkbox" name="hobbies" value="Music"> Music</label>
                        <label><input type="checkbox" name="hobbies" value="Gaming"> Gaming</label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="country">Country</label>
                    <select id="country" required>
                        <option value="">Select Country</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="state">State</label>
                    <select id="state" disabled required>
                        <option value="">Select State</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="district">District</label>
                    <select id="district" disabled required>
                        <option value="">Select District</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="pincode">Pincode</label>
                    <input style="width:130px;" type="number" id="pincode" placeholder="Enter Pincode" max="6" required>
                </div>

                <div class="button-group">
                    <button type="submit" id="submitBtn" class="btn btn-submit">Submit</button>
                    <button type="button" id="cancelBtn" class="btn btn-cancel" style="display: none;">Cancel</button>
                </div>
            </form>
        </section>

        <!-- User-Data Table  -->
         
        <section class="table-card">
            <h2>Users List</h2>
            <div class="table-div">
                <table class="user-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Phone</th>
                            <th>Gender</th>
                            <th>Hobbies</th>
                            <th>Address</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="userTableBody">
                    </tbody>
                </table>
            </div>
        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
